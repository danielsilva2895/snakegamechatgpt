<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jogo da Cobrinha (Snake)</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --accent: #22c55e;
        --accent-dark: #16a34a;
        --food: #ef4444;
        --text: #f8fafc;
        --grid: rgba(255,255,255,0.05);
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 650px;
        text-align: center;
    }

    h1 {
        margin-bottom: 10px;
        font-size: clamp(1.8rem, 4vw, 2.5rem);
    }

    .score-board {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 15px;
        font-size: 1.1rem;
        font-weight: bold;
    }

    .game-wrapper {
        position: relative;
        display: inline-block;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    canvas {
        display: block;
        background-color: #111827;
        max-width: 100%;
        height: auto;
    }

    .overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.75);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 15px;
        padding: 20px;
        text-align: center;
    }

    .overlay.show {
        display: flex;
    }

    .overlay h2 {
        font-size: 2rem;
        color: #fff;
    }

    .overlay p {
        font-size: 1.1rem;
    }

    button {
        border: none;
        background: var(--accent);
        color: white;
        padding: 12px 22px;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s ease;
    }

    button:hover {
        background: var(--accent-dark);
        transform: translateY(-2px);
    }

    .instructions {
        margin-top: 15px;
        opacity: 0.9;
        font-size: 0.95rem;
    }

    @media (max-width: 600px) {
        .score-board {
            flex-direction: column;
            gap: 8px;
        }
    }
</style>
</head>
<body>

<div class="container">
    <h1>🐍 Jogo da Cobrinha</h1>

    <div class="score-board">
        <div>Pontuação: <span id="score">0</span></div>
        <div>Recorde: <span id="highScore">0</span></div>
    </div>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="600" height="600"></canvas>

        <div class="overlay" id="gameOverScreen">
            <h2>Game Over</h2>
            <p>Sua pontuação: <span id="finalScore">0</span></p>
            <button id="restartBtn">Jogar Novamente</button>
        </div>
    </div>

    <div class="instructions">
        Use as teclas ↑ ↓ ← → para controlar a cobra.
    </div>
</div>

<script>
/*
=========================================================
JOGO DA COBRINHA (SNAKE)
- HTML, CSS e JavaScript puros
- Sem dependências externas
- Funciona localmente no navegador
=========================================================
*/

// Canvas e contexto de desenho
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Configurações do tabuleiro
const GRID_SIZE = 20;
const TILE_COUNT = canvas.width / GRID_SIZE;

// Elementos da interface
const scoreElement = document.getElementById("score");
const highScoreElement = document.getElementById("highScore");
const gameOverScreen = document.getElementById("gameOverScreen");
const finalScoreElement = document.getElementById("finalScore");
const restartBtn = document.getElementById("restartBtn");

// Estado do jogo
let snake;
let food;
let direction;
let nextDirection;
let score;
let gameLoop;
let gameSpeed = 120;
let highScore = Number(localStorage.getItem("snakeHighScore")) || 0;

highScoreElement.textContent = highScore;

/**
 * Inicializa ou reinicia o jogo
 */
function initGame() {
    snake = [
        { x: 10, y: 10 }
    ];

    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };

    score = 0;
    scoreElement.textContent = score;

    createFood();

    gameOverScreen.classList.remove("show");

    clearInterval(gameLoop);
    gameLoop = setInterval(updateGame, gameSpeed);
}

/**
 * Gera alimento em posição aleatória
 * evitando que apareça sobre a cobra
 */
function createFood() {
    let validPosition = false;

    while (!validPosition) {
        food = {
            x: Math.floor(Math.random() * TILE_COUNT),
            y: Math.floor(Math.random() * TILE_COUNT)
        };

        validPosition = !snake.some(
            segment => segment.x === food.x && segment.y === food.y
        );
    }
}

/**
 * Atualiza a lógica principal do jogo
 */
function updateGame() {
    direction = nextDirection;

    const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
    };

    // Colisão com parede
    if (
        head.x < 0 ||
        head.y < 0 ||
        head.x >= TILE_COUNT ||
        head.y >= TILE_COUNT
    ) {
        endGame();
        return;
    }

    // Colisão com o próprio corpo
    for (let segment of snake) {
        if (segment.x === head.x && segment.y === head.y) {
            endGame();
            return;
        }
    }

    snake.unshift(head);

    // Comeu alimento
    if (head.x === food.x && head.y === food.y) {
        score++;
        scoreElement.textContent = score;

        if (score > highScore) {
            highScore = score;
            localStorage.setItem("snakeHighScore", highScore);
            highScoreElement.textContent = highScore;
        }

        createFood();
    } else {
        snake.pop();
    }

    drawGame();
}

/**
 * Desenha todos os elementos do jogo
 */
function drawGame() {
    // Fundo
    ctx.fillStyle = "#111827";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grade visual
    drawGrid();

    // Alimento
    ctx.fillStyle = "#ef4444";
    ctx.beginPath();
    ctx.arc(
        food.x * GRID_SIZE + GRID_SIZE / 2,
        food.y * GRID_SIZE + GRID_SIZE / 2,
        GRID_SIZE / 2.4,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Cobra
    snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? "#22c55e" : "#16a34a";

        ctx.fillRect(
            segment.x * GRID_SIZE + 1,
            segment.y * GRID_SIZE + 1,
            GRID_SIZE - 2,
            GRID_SIZE - 2
        );
    });
}

/**
 * Desenha linhas da grade
 */
function drawGrid() {
    ctx.strokeStyle = "rgba(255,255,255,0.05)";
    ctx.lineWidth = 1;

    for (let i = 0; i <= TILE_COUNT; i++) {
        const pos = i * GRID_SIZE;

        ctx.beginPath();
        ctx.moveTo(pos, 0);
        ctx.lineTo(pos, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, pos);
        ctx.lineTo(canvas.width, pos);
        ctx.stroke();
    }
}

/**
 * Finaliza o jogo
 */
function endGame() {
    clearInterval(gameLoop);

    finalScoreElement.textContent = score;
    gameOverScreen.classList.add("show");
}

/**
 * Controle por teclado
 */
document.addEventListener("keydown", (event) => {
    switch (event.key) {
        case "ArrowUp":
            if (direction.y !== 1) {
                nextDirection = { x: 0, y: -1 };
            }
            break;

        case "ArrowDown":
            if (direction.y !== -1) {
                nextDirection = { x: 0, y: 1 };
            }
            break;

        case "ArrowLeft":
            if (direction.x !== 1) {
                nextDirection = { x: -1, y: 0 };
            }
            break;

        case "ArrowRight":
            if (direction.x !== -1) {
                nextDirection = { x: 1, y: 0 };
            }
            break;
    }
});

/**
 * Botão de reinício
 */
restartBtn.addEventListener("click", initGame);

// Inicialização
initGame();
drawGame();
</script>

</body>
</html>
